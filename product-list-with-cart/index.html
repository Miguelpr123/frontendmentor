<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Frontend Mentor | Product list with cart</title>

    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-10 my-20 px-5 sm:px-10 lg:px-20 xl:px-40  ">
        <div class=" md:col-span-2">
            <div class="my-4">
                <h1 style="font-size: 300%; font-weight: bold;">Desserts</h1>
            </div>
            <div class="w-full grid grid-cols-1 gap-10 sm:grid-cols-2 lg:grid-cols-3 justify-stretch " id="porduct_container">
                <!-- Javascript -->
            </div>
        </div>

        <!-- Cart -->
        <div>
            <div class="flex flex-col p-8 rounded-md" style="background: var(--Rose-50)" id="cart_container">
                <!-- Javascript -->
            </div>
        </div>

    </div>

    <!-- Modal -->
    <div id="myModal" class="fixed inset-0 flex items-center justify-center z-50 hidden">
        <div class="fixed inset-0 bg-black opacity-50"></div>
        <div class="bg-white rounded-lg shadow-lg p-8 px-8 z-10 w-11/12 sm:w-3/4 md:w-2/4 lg:w-1/3">

            <div>
                <img src="assets/images/icon-order-confirmed.svg" alt="">
            </div>

            <h2 class="text-2xl font-semibold mt-4">ORDER CONFIRMED</h2>
            <p class="mt-1" style="color: var(--Rose-500);" >We hope you enjoy your food!</p>

            <div class="rounded-md p-4 mt-6" style="background-color: var(--Rose-100)" >
                <div id="modal_cart_container"></div>
            </div>

            <div class="mt-6 flex justify-end">
                <button id="closeModal" class="w-full rounded-full px-4 py-2 text-white bg-red-600 hover:bg-red-700">
                    Start New Order
                </button>
            </div>
        </div>
    </div>



    <script src="assets/js/main.js"></script>

    <script>
        window.addEventListener('click', (event) => {
            const openModalButton = document.getElementById('openModal');
            const closeModalButton = document.getElementById('closeModal');
            const modal = document.getElementById('myModal');

            openModalButton.addEventListener('click', () => {
                modal.classList.remove('hidden');
            });

            closeModalButton.addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            if (event.target === modal) {
                modal.classList.add('hidden');
            }
        });

    </script>




</body>

</html>
